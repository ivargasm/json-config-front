<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fondo redondeado con acabado moderno -->
  <rect width="64" height="64" rx="16" fill="#0B0F19"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#1E293B" stroke-width="1"/>

  <defs>
    <!-- Gradiente Índigo para la estructura de Datos -->
    <linearGradient id="dbGrad" x1="16" y1="18" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Gradiente Esmeralda Nexus para la IA -->
    <linearGradient id="aiGrad" x1="0" y1="0" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Resplandor sutil para la chispa de IA -->
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Cilindro Base de Datos - Nivel Inferior -->
  <path d="M16 38 C16 43 48 43 48 38 V43 C48 47.5 16 47.5 16 43 Z" fill="url(#dbGrad)" opacity="0.75"/>

  <!-- Cilindro Base de Datos - Nivel Medio -->
  <path d="M16 28 C16 33 48 33 48 28 V33 C48 37.5 16 37.5 16 33 Z" fill="url(#dbGrad)" opacity="0.95"/>

  <!-- Tapa Superior del Cilindro -->
  <ellipse cx="32" cy="23" rx="16" ry="5.5" fill="#818CF8"/>
  <ellipse cx="32" cy="22" rx="14.5" ry="4.5" fill="#C7D2FE" opacity="0.9"/>

  <!-- Conexiones / Nodos neuronales -->
  <circle cx="21" cy="40" r="1.75" fill="#34D399"/>
  <circle cx="32" cy="42.5" r="1.75" fill="#34D399"/>
  <circle cx="43" cy="40" r="1.75" fill="#34D399"/>

  <!-- Chispa de Inteligencia Artificial (Estrella de Nexus) -->
  <g transform="translate(39, 10)" filter="url(#aiGlow)">
    <path d="M0 7 C4 6.5 6.5 4 7 0 C7.5 4 10 6.5 14 7 C10 7.5 7.5 10 7 14 C6.5 10 4 7.5 0 7 Z" fill="url(#aiGrad)"/>
    <circle cx="7" cy="7" r="1.8" fill="#FFFFFF"/>
  </g>
</svg>
